grid:

  lora_config:
    - {r: 32, alpha: 32}
    - {r: 32, alpha: 64}
    - {r: 64, alpha: 64}
    - {r: 64, alpha: 128}
    - {r: 128, alpha: 128}
    - {r: 128, alpha: 256}

  training.learning_rate:
    - 1e-4
    - 3e-4
    - 5e-4

  seed:
