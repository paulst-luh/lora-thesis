#
# Diagnostic follow-up, same logic as the FFT moreseeds round: at
# (r=32,alpha=64,lr=3e-4) for lora.target=full, the existing 3-seed
# main sweep already shows a partial-collapse signature ([0.888, 0.171,
# 0.171] -- 2 of 3 seeds diverged). With only 3 seeds there's no way
# to tell a reliable ~66% collapse rate from bad luck. These are 7 NEW
# seeds (45-51), not repeats of 42/43/44 -- combined with
# 12_main_full.yaml's 3 seeds, that's 10 total for this cell.
#

grid:

  lora_config:
    - {r: 32, alpha: 64}

  seed:
    - 45
    - 46
    - 47
    - 48
    - 49
    - 50
    - 51

fixed:

  output.root: results/mnli/prompting_main_full_riskyseeds_lr3e4

  adaptation: lora
  lora.target: full

  training.learning_rate: 3e-4

  dataset.subset_size: 5000
  training.epochs: 3
