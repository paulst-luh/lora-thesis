include: _task.yaml

experiment_group: mnli_prompting
experiment_name: mnli_prompting_ladder_isostep

grid:

  dataset.subset_size:
    - 1000
    - 5000
    - 20000
    - 50000

  lora_config:
    - {r: 4, alpha: 8}
    - {r: 8, alpha: 16}
    - {r: 16, alpha: 32}
    - {r: 32, alpha: 64}
    - {r: 64, alpha: 128}

  training.learning_rate:
    - 1e-4
    - 3e-4

  seed:
    - 42
    - 43
    - 44

fixed:

  output.root: results/mnli/prompting_ladder_isostep

  adaptation: lora
  lora.target: attention

  #
  # iso_step: every ladder rung sees the identical number of optimizer
  # steps (938 = 3 epochs over 5k examples at effective batch size 16,
  # i.e. training.batch_size 8 x training.grad_accum 2, both from
  # _base.yaml -- 5000/16*3 ~= 937.5, rounded up to 938). The 1k run
  # just loops over its smaller pool more times to reach the same step
  # count; the 50k run stops long before covering its pool once.
  # training.epochs is deliberately left unset: resolve_schedule's
  # iso_step branch never reads it (see src/utils/training.py) --
  # setting it here would be misleading, not just redundant.
  #

  training.regime: iso_step
  training.max_steps: 938
