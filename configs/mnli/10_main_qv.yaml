include: _task.yaml

experiment_group: mnli_prompting
experiment_name: mnli_prompting_main_qv

grid:

  #
  # Paired (rank, alpha) -- not independently crossed -- so that
  # scaling_ratio (alpha/rank) only ever takes the values you actually
  # intended to test, rather than every rank x every alpha producing
  # scaling ratios nobody asked for. See generate_experiments' special
  # handling of the "lora_config" grid key in src/utils/config.py,
  # which expands each entry into lora.r/lora.alpha directly.
  #

  lora_config:
    - {r: 4, alpha: 8}      # scaling_ratio 2
    - {r: 8, alpha: 8}      # scaling_ratio 1
    - {r: 8, alpha: 16}     # scaling_ratio 2
    - {r: 16, alpha: 16}    # scaling_ratio 1
    - {r: 16, alpha: 32}    # scaling_ratio 2
    - {r: 32, alpha: 32}    # scaling_ratio 1
    - {r: 32, alpha: 64}    # scaling_ratio 2
    - {r: 64, alpha: 128}   # scaling_ratio 2

  training.learning_rate:
    - 1e-4
    - 3e-4
    - 5e-4

  seed:
    - 42
    - 43
    - 44

fixed:

  output.root: results/mnli/prompting_main_qv

  adaptation: lora
  lora.target: qv

  dataset.subset_size: 5000
  training.epochs: 3
