#
# Diagnostic follow-up, same logic as the FFT moreseeds round: at
# (r=8,alpha=16,lr=5e-4) for lora.target=full, the existing 3-seed main
# sweep already shows a partial-collapse signature ([0.864, 0.171,
# 0.884] -- 1 of 3 seeds diverged). With only 3 seeds there's no way
# to tell "reliably bad" from "one unlucky draw". These are 7 NEW
# seeds (45-51), not repeats of 42/43/44 -- combined with
# 12_main_full.yaml's 3 seeds, that's 10 total for this cell, matching
# the FFT moreseeds diagnostic exactly.
#

grid:

  lora_config:
    - {r: 8, alpha: 16}

  seed:
    - 45
    - 46
    - 47
    - 48
    - 49
    - 50
    - 51

