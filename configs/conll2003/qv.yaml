experiment_group: conll2003
experiment_name: conll2003_qv

grid:

  lora_config:
    - {r: 8, alpha: 8}
    - {r: 8, alpha: 16}
    - {r: 16, alpha: 16}
    - {r: 16, alpha: 32}
    - {r: 32, alpha: 32}
    - {r: 32, alpha: 64}

  training.learning_rate:
    - 1e-4
    - 3e-4
    - 5e-4

  seed:
    - 42
    - 43
    - 44

fixed:

  output.root: results/conll2003/qv

  model.name: qwen2-7b

  task.name: token_classification
  dataset.name: conll2003
  adaptation: lora
  lora.target: qv
  pipeline.type: head

  dataset.data_seed: 42

  dataset.subset_size: 5000
  training.batch_size: 8
  training.grad_accum: 2
  training.epochs: 3
  training.weight_decay: 0.01
  training.warmup_ratio: 0.03
  training.lr_scheduler_type: cosine
  training.optimizer: paged_adamw_8bit