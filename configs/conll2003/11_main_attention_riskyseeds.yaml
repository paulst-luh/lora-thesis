include: _task.yaml

experiment_group: conll2003_prompting
experiment_name: conll2003_prompting_main_attention_riskyseeds

#
# Diagnostic follow-up, same logic as the FFT moreseeds round: at
# (r=64,alpha=128,lr=5e-4) for lora.target=attention, the existing
# 3-seed main sweep already shows a partial-collapse signature ([0.009,
# 0.962, 0.955] -- 1 of 3 seeds diverged). With only 3 seeds there's no
# way to tell a reliable collapse rate from bad luck. These are 7 NEW
# seeds (45-51), not repeats of 42/43/44 -- combined with
# 11_main_attention.yaml's 3 seeds, that's 10 total for this cell.
#

grid:

  lora_config:
    - {r: 64, alpha: 128}

  seed:
    - 45
    - 46
    - 47
    - 48
    - 49
    - 50
    - 51

fixed:

  output.root: results/conll2003/prompting_main_attention_riskyseeds

  adaptation: lora
  lora.target: attention

  training.learning_rate: 5e-4

  dataset.subset_size: 5000
  training.epochs: 3
